services:
  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend

  web:
    build: .
    command: sh -c "python manage.py migrate --fake-initial && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-60}"
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      ERROR_LOG_FILE: /app/logs/error.log
    volumes:
      - error_logs:/app/logs
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
volumes:
  postgres_data:
  error_logs:
networks:
  backend:
    driver: bridge
